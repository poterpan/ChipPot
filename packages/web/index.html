<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Android 的內嵌 WebView（Google Chat 等）首次載入可能忽略上面這行，退回 980px 舊版
         視窗——版面是手機版但整頁被縮到約 0.38 倍。那是**宿主 App 的 WebView 設定**造成的
         （setUseWideViewPort / setLoadWithOverviewMode 由 App 決定，預設不啟用 wide viewport），
         網頁端無法覆寫：實測 React／Gatsby／Vue 的第三方網站在同一個 WebView 下全都中，
         換一個 App 開就正常。曾加過偵測並改寫 meta 的自癒 guard，但在真實的 Google Chat
         WebView 上未生效，故移除——詳見 issue #57。 -->
    <meta name="theme-color" content="#f4efe4" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ChipPot · 繳費登記</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+TC:wght@400;500;700&family=Spline+Sans+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
